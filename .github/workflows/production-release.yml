name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_PUBLIC_DATA_PROVIDER: published
      VITE_ENABLE_PUBLISHED_PROVIDER: true
      PLAYWRIGHT_BASE_URL: https://pow4vote.org
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install Supabase CLI
        run: npm ci
        working-directory: .

      - name: Install web dependencies
        run: npm ci

      - name: Link production Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        working-directory: .

      - name: Check production migration drift
        run: npm run check:production-migration-drift

      - name: Test read contracts
        run: npm run test:read-contracts

      - name: Lint
        run: npm run lint

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir dist/wrangler-dry-run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --message "Release ${{ github.sha }}"

      - name: Run post-deploy production smoke
        run: npm run test:browser:production
