name: validate-data-update

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Importer/PublicOfficialInterest.Importer.csproj

      - name: Build
        run: dotnet build src/Importer/PublicOfficialInterest.Importer.csproj --configuration Release --no-restore

      - name: Importer dry-run sample
        run: dotnet run --project src/Importer/PublicOfficialInterest.Importer.csproj -- --dry-run samples/sample-changes.json

      - name: Importer dry-run latest data-update changes when present
        shell: bash
        run: |
          if [ -d "data-updates" ]; then
            latest=$(find data-updates -mindepth 2 -maxdepth 2 -name changes.json | sort | tail -n 1)
            if [ -n "$latest" ]; then
              echo "Running dry-run for $latest"
              dotnet run --project src/Importer/PublicOfficialInterest.Importer.csproj -- --dry-run "$latest"
            else
              echo "No data-updates changes.json found, skipping."
            fi
          else
            echo "data-updates directory does not exist, skipping."
          fi

      - name: Safety note
        run: |
          echo "Phase 2 CI still performs dry-run validation only."
          echo "No Supabase connection and no production database writes occur here."
