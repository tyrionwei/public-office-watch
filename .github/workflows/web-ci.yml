name: Web CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check data boundary
        run: npm run check:data-boundary

      - name: Test browser read contracts
        run: npm run test:read-contracts

      - name: Check published exposure boundary
        run: npm run check:published-exposure

      - name: Check public view contracts
        run: npm run check:public-view-contracts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
