name: Web CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  polling-place-data-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test polling-place data tools
        run: npm run test:polling-places

  monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test monitor and review reliability (isolated fixtures)
        run: |
          node --test \
            scripts/monitor-source-retry.test.mjs \
            scripts/plan-monitor-review.test.mjs \
            scripts/run-daily-monitor.test.mjs \
            scripts/run-weekly-monitor.test.mjs \
            scripts/sync-real-public-data.test.mjs \
            scripts/planned-local-race-safety.test.mjs \
            scripts/official-candidate-review.test.mjs \
            scripts/official-candidate-revision.test.mjs \
            scripts/review-official-candidate-snapshot.test.mjs \
            scripts/cec-candidate-source-discovery.test.mjs \
            scripts/cec-referendum-source-monitor.test.mjs \
            scripts/source-monitor-recovery.test.mjs

  web-checks:
    runs-on: ubuntu-latest
    # This job validates mock UI and source contracts; it does not start a database.
    env:
      VITE_PUBLIC_DATA_PROVIDER: mock
      VITE_ENABLE_PUBLISHED_PROVIDER: 'false'
      RUN_LOCAL_CHAT_E2E: '0'
      RUN_LOCAL_PARTICIPATION_E2E: '0'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mock frontend
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check data boundary
        run: npm run check:data-boundary

      - name: Test web contracts (DB write E2E explicitly disabled)
        run: npm run test:read-contracts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test sharing and core mobile browser flows (mock)
        run: npm run test:browser:ci

      - name: Test component identity and saved-state failures (isolated fixtures)
        run: npm run test:state-safety

      - name: Test PWA install and offline fallback (mock)
        run: npm run test:pwa
        env:
          VITE_PUBLIC_DATA_PROVIDER: mock
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Check published exposure boundary
        run: npm run check:published-exposure

      # Keep the live gate available; without DB configuration this command reports skip.
      - name: Check legacy view retirement (skips without DB configuration)
        run: npm run check:public-view-contracts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
