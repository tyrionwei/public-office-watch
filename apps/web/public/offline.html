<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071126" />
    <title>目前離線｜公職資料觀測站</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #071126; color: #e2e8f0; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #12314d 0, #071126 48%); }
      main { width: min(100%, 420px); border: 1px solid #2d6680; background: rgba(7, 17, 38, 0.92); padding: 28px; box-shadow: 8px 8px 0 #020617; }
      img { width: 72px; height: 72px; image-rendering: pixelated; }
      p:first-of-type { margin: 20px 0 0; color: #67e8f9; font-size: 12px; letter-spacing: 0.18em; }
      h1 { margin: 8px 0 0; color: white; font-size: 30px; }
      p { line-height: 1.7; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 12px; border: 1px solid #67e8f9; padding: 0 18px; color: #67e8f9; text-decoration: none; }
      a:focus-visible { outline: 3px solid #facc15; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/brand/icon-192.png" alt="" />
      <p>PUBLIC OFFICE WATCH</p>
      <h1>目前離線</h1>
      <p>無法連上最新公開資料。你可以稍後重新連線；已確認的投票地區仍保存在這台裝置中。</p>
      <a href="/">重新連線</a>
    </main>
  </body>
</html>
